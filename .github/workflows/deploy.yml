name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # A running Pages deployment is never cancelled half way.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    # The official Swift image, the same major version as on the owner's Mac. Swift 6.2 cannot compile the
    # swift-log that SiteKit resolves (`@nonexhaustive`), and setup-swift@v2 does not run on Ubuntu 26.04.
    container: swift:6.4-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build the site
        run: swift run -c release Site build

      - name: Check translations
        run: swift run -c release Site validate

      - name: Check that every linked asset exists (case-sensitive here, as on GitHub Pages)
        run: scripts/check-assets.sh _Site

      - name: Upload the Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _Site

  deploy:
    # Only main publishes, also for a manual run started from another branch.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

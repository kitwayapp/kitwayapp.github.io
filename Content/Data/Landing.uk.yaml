pageTitle: "Kitway – три місця на твій вільний час"

hero:
  eyebrow: "Планувальник дня для iPhone"
  title: "Три місця на твій вільний час"
  subtitle: "Скажи Kitway, скільки годин маєш. Він складе день у твоєму місті або в поїздці: щось побачити, щось скуштувати, десь відпочити – з маршрутом між ними."
  imageAlt: "Kitway, лис із рюкзаком і біноклем, махає лапою"
  comingSoon: "Незабаром в App Store"
  appStoreBadgeAlt: "Завантажити в App Store"

trio:
  title: "Як це працює"
  subtitle: "Обери місто й години. Kitway знайде три місця, які пасують до часу, погоди і твоїх уподобань."
  items:
    - category: "see"
      name: "See"
      description: "Краєвид, вулиця, музей чи парк – щось варте твого погляду."
      imagePath: "/assets/images/fox-scouting.png"
      imageAlt: "Лис дивиться в бінокль"
    - category: "taste"
      name: "Taste"
      description: "Кав'ярня, пекарня чи місцева страва – щось варте зупинки."
      imagePath: "/assets/images/fox-tasting.png"
      imageAlt: "Лис тримає теплу чашку"
    - category: "unwind"
      name: "Unwind"
      description: "Лавка з краєвидом, сад чи тихий куточок – місце, щоб сповільнитися."
      imagePath: "/assets/images/fox-chilling.png"
      imageAlt: "Лис відпочиває на лавці"

features:
  title: "Що вміє Kitway"
  items:
    - title: "План на сьогодні"
      description: "Три зупинки на мапі з часом і маршрутом між ними. Почни день, відмічай кожне місце і заміни зупинку, яка не до душі."
      imagePath: "/assets/images/fox-compass.png"
      imageAlt: "Лис дивиться на компас"
    - title: "Подорожі"
      description: "Їдеш на кілька днів? Kitway складе план на кожен день поїздки і зберігає всі дні в одному місці."
      imagePath: "/assets/images/fox-looking-far.png"
      imageAlt: "Лис дивиться вдалину з каменя"
    - title: "Рюкзак з наліпками"
      description: "Завершений день може принести наліпку. Рюкзак показує міста, дні і місця, де ти побував."
      imagePath: "/assets/images/fox-sticker-backpack.png"
      imageAlt: "Лис показує рюкзак з наліпками"
    - title: "Спогади"
      description: "Завершений день стає спогадом з твоїми нотатками, настроєм і фото. Спогади синхронізуються через твій власний iCloud."
      imagePath: "/assets/images/fox-stamp.png"
      imageAlt: "Лис ставить штамп на завершений день"

screens:
  title: "Kitway у твоєму iPhone"
  subtitle: "Обери години, отримай три місця, пройди день і збережи його в рюкзаку."
  items:
    - id: "today"
      caption: "Обери вільні години"
      imageAlt: "Екран Today у Kitway: сонячний циферблат для вибору годин дня"
    - id: "plan"
      caption: "Три місця на мапі"
      imageAlt: "План дня: мапа з трьома зупинками і розклад See, Taste і Unwind"
    - id: "live"
      caption: "Пройди свій день"
      imageAlt: "Розпочатий день: поточна зупинка і маршрут до наступної"
    - id: "backpack"
      caption: "Збережи свої дні"
      imageAlt: "Рюкзак: мапа міст, де ти побував, з наліпками і днями"

pricing:
  title: "Free і Premium"
  subtitle: "Kitway можна користуватися безкоштовно. Premium знімає обмеження."
  note: "Ціни показує App Store у твоїй валюті. Оплата знімається з твого облікового запису Apple. Керувати підпискою або скасувати її можна в Параметрах iPhone."
  tiers:
    - name: "Kitway Free"
      summary: "Усе потрібне для дня в місті."
      features:
        - "3 плани дня на місяць"
        - "3 заміни в кожному плані"
        - "Перший день поїздки"
        - "Живий день, наліпки і спогади"
    - name: "Kitway Premium"
      badge: "7 днів безкоштовно"
      summary: "Підписка на рік або на місяць. Річна починається з 7 безкоштовних днів."
      highlighted: true
      features:
        - "Без місячного ліміту планів"
        - "Заміняй будь-яку зупинку без ліміту"
        - "Плани на кожен день поїздки"
        - "Голосові нотатки про місця"
    - name: "Trip Pass"
      summary: "Premium на 7 днів. Платиш один раз, без продовження."
      features:
        - "Усе з Premium на одну поїздку"
        - "Без підписки"

faq:
  title: "Питання"
  items:
    - question: "Чи потрібен акаунт?"
      answer: "Ні. Kitway не питає твоє ім'я, пошту чи номер телефону. Застосунок входить анонімно."
    - question: "Де зберігаються мої плани і спогади?"
      answer: "На твоєму iPhone. Спогади також синхронізуються через твій приватний iCloud. Kitway не має власного сервера і їх не бачить."
    - question: "Чи стежить Kitway за моїм місцезнаходженням?"
      answer: "Ні. Kitway використовує твою точку, лише щоб знайти місто, показати погоду і розрахувати час дня. Він не зберігає твоє місцезнаходження. Місто можна вибрати і вручну."
    - question: "Що дає Trip Pass?"
      answer: "Premium на 7 днів за один платіж і без продовження. Він пасує для однієї поїздки."
    - question: "Якими мовами говорить Kitway?"
      answer: "Англійською, українською, німецькою, іспанською, французькою, італійською, польською і бразильською португальською."
    - question: "Який iPhone потрібен?"
      answer: "iPhone з iOS 26 або новішою."


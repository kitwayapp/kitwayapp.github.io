name: "Kitway"
baseURL: "https://kitwayapp.github.io"
description: "Kitway plans your free hours in a city: three places – something to see, something to taste, somewhere to unwind."
language: "en"
contentDirectory: "Content"
outputDirectory: "_Site"

sections: []

navigation:
  logo:
    image: "/assets/images/kitway-head.png"
    imageWidth: 32
    imageHeight: 32
    text: "Kitway"
  items:
    - title: "How it works"
      url: "/#how-it-works"
    - title: "Premium"
      url: "/#pricing"
    - title: "Support"
      url: "/support/"
  showSearch: false
  showThemeToggle: true

footer:
  copyrightName: "Oleksandr Solokha"
  startYear: 2026
  showAttribution: true
  links:
    - title: "Support"
      url: "/support/"
    - title: "Privacy"
      url: "/privacy/"
    - title: "Terms"
      url: "/terms/"
    - title: "Licenses"
      url: "/licenses/"

